# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

reviews:
  profile: "assertive"

  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  review_details: true

  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 10
    base_branches:
      - "main"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    labels:
      - "!do-not-review"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

  path_filters:
    - "!**/target/**"
    - "!**/*.lock"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/generated/**"
    - "!**/*.min.js"
    - "!**/*.min.css"

  path_instructions:
    - path: "backend/src/runtime/**"
      instructions: |
        Review this code as a senior security runtime engineer.

        The Vortex runtime must remain deterministic, explicit, fail-closed
        where required by policy, and independent from HTTP transport details.

        Verify that:
        - Decisions are reproducible for identical inputs.
        - Security-relevant ordering is deterministic.
        - Missing evidence is never silently treated as valid evidence.
        - Fail-closed and fail-open behavior strictly follows RuntimePolicy.
        - Every denial or degraded decision has a stable machine-readable reason.
        - RuntimePolicy remains versioned and explicit.
        - RequestContext is treated as normalized input, not implicitly trusted input.
        - SecurityEvidence clearly distinguishes true, false, unknown, and unavailable states.
        - New operations cannot bypass validation, policy evaluation, or audit.
        - No handler-specific or Actix-specific logic leaks into the runtime layer.
        - Panics, unwrap(), expect(), unchecked indexing, and unsafe code are flagged.
        - Public runtime behavior is covered by unit tests.
        - Security regressions and bypass paths are treated as high-severity findings.

    - path: "backend/src/runtime/validator.rs"
      instructions: |
        Review validation order and enforcement semantics carefully.

        Required deterministic validation order:
        1. operation support
        2. structural validity
        3. identity
        4. payload integrity
        5. signature
        6. replay protection
        7. trust threshold
        8. anonymization requirement

        Flag:
        - reordered checks that alter decision semantics;
        - early returns that omit required reason codes;
        - missing negative-path tests;
        - ambiguous evidence handling;
        - validation paths that accidentally fail open;
        - policies that can be bypassed through default values.

    - path: "backend/src/runtime/policy.rs"
      instructions: |
        Treat policies as security contracts.

        Verify that:
        - Defaults are conservative.
        - Every policy has an explicit version.
        - Allowed operations use deterministic collections.
        - Trust thresholds are explicit and validated.
        - Replay protection and audit requirements cannot be accidentally disabled.
        - Production behavior is not weakened to support benchmark endpoints.
        - Policy changes include tests for both allowed and denied behavior.

    - path: "backend/src/runtime/decision.rs"
      instructions: |
        Ensure decisions are stable, auditable, and machine-readable.

        Verify that:
        - Outcomes are explicit.
        - Reason codes are stable and non-ambiguous.
        - Denials cannot be represented as successful execution.
        - Decisions contain sufficient policy and evidence context for audit.
        - Human-readable messages do not replace structured reason codes.
        - Serialization changes preserve compatibility or are versioned.

    - path: "backend/src/runtime/context.rs"
      instructions: |
        Treat all incoming request data as untrusted.

        Verify:
        - No request field is trusted merely because it exists.
        - Identity, payload metadata, timestamps, and request IDs are validated.
        - Context construction cannot silently invent security evidence.
        - Optional fields are handled explicitly.
        - Sensitive data is not leaked through Debug, logs, errors, or serialization.

    - path: "backend/src/runtime/evidence.rs"
      instructions: |
        Review evidence modeling for ambiguity and unsafe assumptions.

        Verify:
        - Unknown is not equivalent to false.
        - Unavailable evidence is not interpreted as successful validation.
        - Evidence provenance can be determined.
        - Conflicting evidence is handled deterministically.
        - Summaries do not discard security-relevant detail.
        - Tests cover absent, malformed, contradictory, and boundary evidence.

    - path: "backend/src/**/*pqc*.rs"
      instructions: |
        Treat all cryptographic code as experimental unless it relies on a
        recognized, reviewed implementation of a standardized algorithm.

        Flag:
        - custom cryptographic primitives;
        - non-cryptographic randomness;
        - hard-coded secrets or keys;
        - key reuse;
        - missing zeroization;
        - insecure serialization;
        - insufficient domain separation;
        - unauthenticated metadata;
        - timing-sensitive comparisons;
        - misleading production-security claims;
        - tests that validate only successful round trips.

        Require negative tests for corrupted keys, messages, signatures,
        malformed inputs, replay attempts, and serialization failures.

    - path: "backend/src/signer_lwe.rs"
      instructions: |
        Perform a cryptography-focused review.

        Do not assume that naming something LWE or PQC makes it secure.
        Identify whether the implementation is a standardized construction,
        a research prototype, or custom cryptography.

        Flag any claim or code path that could cause this implementation to be
        treated as production-grade without independent cryptographic review.

    - path: "backend/src/anonymizer_engine.rs"
      instructions: |
        Review for privacy, data leakage, reversibility, and incomplete transformations.

        Verify:
        - All sensitive fields are covered.
        - Nested and malformed inputs cannot bypass anonymization.
        - Original sensitive values do not appear in logs or error messages.
        - Transformations are deterministic only where intentionally required.
        - Tests cover Unicode, empty values, very large input, nested objects,
          repeated identifiers, malformed input, and partial failures.

    - path: "backend/src/main.rs"
      instructions: |
        Keep the HTTP entrypoint thin.

        Flag:
        - business logic inside handlers;
        - direct execution that should pass through the runtime;
        - missing input-size limits;
        - missing timeout handling;
        - sensitive error disclosure;
        - inconsistent status codes;
        - unauthenticated production endpoints;
        - benchmark routes being represented as production runtime routes.

    - path: "vortex-ebpf/**"
      instructions: |
        Review as verifier-sensitive kernel networking code.

        Verify:
        - Every packet access is bounds checked.
        - Malformed and truncated packets are handled safely.
        - Endianness is correct.
        - No unbounded loops exist.
        - Map lookups and absent-map entries have explicit behavior.
        - Fail-open versus fail-closed behavior is documented.
        - Userspace decisions cannot remain active indefinitely without expiry.
        - Logging cannot create unacceptable performance overhead.
        - XDP_DROP decisions cannot be triggered by incomplete parsing.
        - Tests or packet fixtures cover malformed Ethernet, IPv4, and TCP headers.

    - path: ".github/workflows/**"
      instructions: |
        Review CI as part of the security boundary.

        Verify:
        - cargo fmt, cargo check, strict clippy, and cargo test are enforced.
        - Workflow permissions use least privilege.
        - Third-party actions are pinned to stable versions.
        - Secrets are never exposed to pull requests from forks.
        - Security checks cannot be silently skipped.
        - Caching does not introduce unsafe or stale artifacts.
        - Failure of a required test blocks merging.

    - path: "backend/src/**"
      instructions: |
        Apply Rust production-quality review.

        Flag:
        - unwrap(), expect(), panic!(), todo!(), and unreachable!() in reachable paths;
        - ignored Result values;
        - broad error conversion that destroys root-cause information;
        - integer overflow or unsafe casts;
        - accidental clones of secrets or large payloads;
        - blocking work inside async handlers;
        - unbounded allocation;
        - missing limits on attacker-controlled input;
        - unsafe concurrency assumptions;
        - public APIs without tests;
        - behavior changes without documentation.

    - path: "backend/tests/**"
      instructions: |
        Review tests using a TDD and adversarial-security mindset.

        Require tests to cover:
        - expected success;
        - expected denial;
        - malformed input;
        - missing evidence;
        - boundary values;
        - replay;
        - invalid identity;
        - invalid signature;
        - conflicting evidence;
        - fail-open and fail-closed policy behavior;
        - deterministic repeated execution.

        Flag tests that only assert that code runs without checking exact outcomes
        and stable reason codes.

    - path: "**/*test*.rs"
      instructions: |
        Ensure tests are deterministic, isolated, descriptive, and meaningful.

        Prefer table-driven tests where multiple policy/evidence combinations exist.
        Avoid sleeps, external-network dependencies, shared mutable global state,
        and assertions that are too broad to detect regressions.

    - path: "docs/**"
      instructions: |
        Check documentation for technical accuracy and alignment with the code.

        Enforce a clear distinction between:
        - implemented;
        - experimental;
        - planned.

        Flag unsupported claims such as production-grade, mathematically secure,
        post-quantum secure, zero-trust, enterprise-ready, or formally verified
        unless the repository contains sufficient evidence.

    - path: "CLAUDE.md"
      instructions: |
        Treat this file as an engineering journal and repository guidance document.

        Check that:
        - dates use YYYY-MM-DD;
        - completed and pending work are clearly separated;
        - architectural decisions match the implementation;
        - outdated instructions are identified;
        - security guarantees are not overstated.

chat:
  auto_reply: true
