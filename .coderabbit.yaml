# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  review_details: true

  high_level_summary_instructions: |
    Summarize the security and architectural impact of the pull request.

    Explicitly identify:
    - runtime behavior changed;
    - security guarantees affected;
    - policies or decision semantics changed;
    - tests added or missing;
    - experimental versus production-facing behavior;
    - migration or compatibility risks.

    Do not describe formatting-only changes as security improvements.

  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    base_branches:
      - "main"
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    labels:
      - "!do-not-review"
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"

  finishing_touches:
    unit_tests:
      enabled: true
    docstrings:
      enabled: true

  path_filters:
    - "!**/target/**"
    - "!**/*.lock"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/generated/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!coverage/**"
    - "!artifacts/**"

  path_instructions:
    - path: "backend/src/runtime/**"
      instructions: |
        Act as a Staff Security Engineer reviewing a deterministic enforcement runtime.

        Treat the following as blocking security regressions:
        - an operation reaching execution without policy evaluation;
        - missing evidence being interpreted as successful evidence;
        - unknown or unavailable evidence being collapsed into false;
        - fail-closed behavior becoming fail-open without an explicit policy change;
        - denial decisions lacking stable machine-readable reason codes;
        - nondeterministic ordering affecting validation or decisions;
        - HTTP or Actix-specific behavior leaking into the runtime;
        - panics, unwrap(), expect(), todo!(), unreachable!(), unsafe code,
          or unchecked indexing in reachable runtime paths;
        - secrets or attacker-controlled payloads exposed through Debug, logs,
          errors, serialization, or audit records;
        - public runtime behavior changing without negative-path tests.

        Verify that identical normalized inputs and policy versions produce
        identical decisions.

        Require evidence for claims that a change improves security.
        A refactor alone is not a security improvement.

    - path: "backend/src/runtime/validator.rs"
      instructions: |
        Review this file as a security boundary.

        Required validation order:
        1. operation support
        2. structural validity
        3. identity
        4. payload integrity
        5. signature
        6. replay protection
        7. trust threshold
        8. anonymization requirement

        Request changes when:
        - the order changes without an explicit architectural decision;
        - an early return suppresses required reason codes;
        - absent evidence can pass validation unexpectedly;
        - defaults can bypass policy;
        - a denial branch is not tested;
        - fail-open behavior is introduced implicitly;
        - validation results depend on map iteration order or unstable state.

        Require tests for:
        - allowed operation;
        - unsupported operation;
        - missing structural evidence;
        - invalid identity;
        - invalid payload integrity;
        - invalid signature;
        - replay;
        - trust below threshold;
        - missing anonymization;
        - fail-open and fail-closed modes;
        - repeated deterministic execution.

    - path: "backend/src/runtime/policy.rs"
      instructions: |
        Treat RuntimePolicy as a versioned security contract.

        Request changes when:
        - a production default is weakened;
        - a policy version is absent or silently reused after semantic changes;
        - an operation becomes allowed without tests;
        - replay protection, audit, identity, signature, or payload integrity
          requirements are disabled without explicit justification;
        - benchmark requirements influence production defaults;
        - incompatible policy changes lack migration documentation;
        - policy construction accepts invalid trust thresholds or contradictory settings.

        Require conservative defaults and deterministic collections.

    - path: "backend/src/runtime/decision.rs"
      instructions: |
        Review decisions for auditability and compatibility.

        Request changes when:
        - allow and deny outcomes can be confused;
        - successful execution can be represented after denial;
        - human-readable messages replace structured reason codes;
        - reason codes are renamed or removed without compatibility notes;
        - policy version or relevant evidence context is absent;
        - serialization changes are unversioned;
        - sensitive information is included in public decision output.

    - path: "backend/src/runtime/context.rs"
      instructions: |
        Treat RequestContext as normalized but still untrusted input.

        Verify:
        - request identifiers, timestamps, identities, and payload metadata are validated;
        - context construction does not invent successful evidence;
        - optional fields remain distinguishable from validated fields;
        - attacker-controlled values have explicit size limits;
        - secrets and raw sensitive payloads are not logged or serialized unintentionally;
        - timestamps and replay windows do not trust client time blindly.

    - path: "backend/src/runtime/evidence.rs"
      instructions: |
        Review evidence modeling for ambiguity and provenance.

        Request changes when:
        - unknown, unavailable, false, and true are conflated;
        - evidence provenance cannot be determined;
        - stale evidence has no timestamp or freshness semantics;
        - contradictory evidence is resolved nondeterministically;
        - evidence summaries discard details needed for denial or audit;
        - evidence can be constructed as verified without a verifier.

        Require boundary and contradiction tests.

    - path: "backend/src/signer_lwe.rs"
      instructions: |
        Treat this file as experimental cryptographic research code.

        Do not infer security from the names LWE, lattice, Fiat-Shamir, or PQC.

        Request changes when:
        - the implementation is described as production-grade;
        - custom primitives are exposed as standardized cryptography;
        - non-cryptographic hashes or randomness protect production data;
        - toy parameters are used in production-facing paths;
        - key generation, serialization, storage, rotation, or zeroization is unsafe;
        - comparisons leak timing-sensitive information;
        - invalid dimensions or malformed signatures can panic;
        - tests validate only successful round trips;
        - known attack success rates are normalized as acceptable production behavior.

        Require explicit separation between:
        - educational or research implementation;
        - benchmark implementation;
        - production cryptographic provider.

        Prefer migration toward a reviewed implementation of a standardized
        post-quantum signature algorithm instead of expanding custom cryptography.

    - path: "backend/src/**/*pqc*.rs"
      instructions: |
        Review all post-quantum-facing code for algorithm identity, key lifecycle,
        domain separation, input validation, replay, serialization, and misuse resistance.

        Request changes for:
        - hard-coded keys or secrets;
        - keys derived directly from API keys or customer identifiers;
        - key reuse across tenants or environments;
        - unauthenticated metadata;
        - insecure fallback algorithms;
        - silent downgrade behavior;
        - unbounded attacker-controlled input;
        - production claims unsupported by external review.

        Require negative tests for corrupted keys, signatures, messages,
        serialization, tenant separation, replay, and wrong-key verification.

    - path: "backend/src/anonymizer_engine.rs"
      instructions: |
        Review as a privacy boundary.

        Request changes when:
        - nested data can bypass anonymization;
        - unknown fields are silently copied despite containing sensitive data;
        - original values appear in logs, errors, metrics, or audit events;
        - transformations are reversible without an explicit authorized design;
        - Unicode, malformed structures, large payloads, or partial failures are untested;
        - repeated identifiers lose or unexpectedly preserve correlation;
        - anonymization is claimed when data is merely masked cosmetically.

    - path: "backend/src/main.rs"
      instructions: |
        Keep the HTTP entrypoint thin.

        Request changes when:
        - handlers execute protected operations directly instead of using the runtime;
        - authentication, policy selection, decision, audit, or execution logic
          is duplicated inside handlers;
        - attacker-controlled bodies lack size limits;
        - blocking CPU work runs directly in async handlers;
        - timeouts or cancellation are missing;
        - internal errors or secrets are exposed;
        - benchmark endpoints are presented as production runtime endpoints;
        - status codes contradict RuntimeDecision outcomes.

    - path: "vortex-ebpf/**"
      instructions: |
        Review as verifier-sensitive kernel networking code.

        Request changes when:
        - packet access lacks complete bounds checks;
        - malformed Ethernet, IPv4, IPv6, TCP, or UDP data can reach unchecked reads;
        - byte order is ambiguous;
        - loops are unbounded;
        - absent map entries have undocumented behavior;
        - decisions have no expiry or freshness mechanism;
        - fail-open and fail-closed behavior is implicit;
        - incomplete parsing can trigger XDP_DROP;
        - high-volume logging can affect packet-path performance;
        - userspace identity is trusted without verification.

        Require packet fixtures or tests for truncated and malformed headers.

    - path: ".github/workflows/**"
      instructions: |
        Treat CI as part of the security boundary.

        Request changes when:
        - cargo fmt, cargo check, strict Clippy, or cargo test can be skipped;
        - warnings stop being denied merely to make CI green;
        - third-party actions use floating branches without justification;
        - workflow permissions exceed least privilege;
        - forked pull requests can access secrets;
        - required checks continue after silent failures;
        - generated or cached artifacts can cross trust boundaries;
        - security jobs are informational instead of merge-blocking.

        Distinguish warnings from blocking failures accurately.

    - path: "backend/src/**"
      instructions: |
        Apply production-quality Rust review.

        Request changes for:
        - ignored Result values;
        - unwrap(), expect(), panic!(), todo!(), or unreachable!() in reachable paths;
        - unsafe blocks without a documented invariant and focused tests;
        - lossy error conversion;
        - integer overflow, truncation, or unchecked casts;
        - unbounded allocation from attacker-controlled values;
        - accidental secret cloning or serialization;
        - blocking work in async contexts;
        - nondeterministic security-relevant collections;
        - public API behavior changes without tests and documentation.

        Do not request changes for stylistic preferences that rustfmt or Clippy
        already enforce unless they create a correctness or security problem.

    - path: "backend/tests/**"
      instructions: |
        Review tests using TDD and adversarial-security principles.

        Require exact assertions for:
        - success;
        - denial;
        - stable reason codes;
        - malformed input;
        - missing and unavailable evidence;
        - boundary values;
        - replay;
        - invalid identity;
        - invalid signature;
        - conflicting evidence;
        - fail-open and fail-closed behavior;
        - deterministic repeated execution.

        Flag:
        - tests that only assert execution did not panic;
        - nondeterministic sleeps or timing assumptions;
        - external network dependencies;
        - shared mutable global state;
        - broad assertions unable to detect regressions;
        - security tests whose expected outcome permits a known bypass.

    - path: "**/*test*.rs"
      instructions: |
        Prefer deterministic table-driven tests.

        Verify that test names describe the security property being protected.
        Every fixed security bug should have a regression test that fails if the
        vulnerable behavior is reintroduced.

    - path: "docs/**"
      instructions: |
        Review documentation against actual repository behavior.

        Require explicit labels for:
        - implemented;
        - experimental;
        - planned;
        - deprecated.

        Request changes for unsupported claims including:
        - production-grade;
        - enterprise-ready;
        - formally verified;
        - mathematically secure;
        - post-quantum secure;
        - zero-trust;
        - impossible to bypass.

        Architecture diagrams and runtime descriptions must match executable code.

    - path: "CLAUDE.md"
      instructions: |
        Review this file as an engineering journal and contributor guidance file.

        Verify:
        - dates use YYYY-MM-DD;
        - completed and pending work are distinct;
        - instructions match current paths and types;
        - architectural decisions match code;
        - known limitations remain visible;
        - outdated guidance is removed rather than contradicted by newer sections.

knowledge_base:
  code_guidelines:
    enabled: true

chat:
  auto_reply: true
