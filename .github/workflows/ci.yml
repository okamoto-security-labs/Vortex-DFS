name: Vortex DFS CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Check Formatting
      run: cargo fmt -- --check

    - name: Run Clippy (Linter estrito)
      run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

    - name: Run Deterministic Test Suite
      run: cargo test --manifest-path backend/Cargo.toml --verbose
      env:
        VORTEX_MASTER_KEY: 'test_master_key_32_bytes_base64_encoded_dummy=='
        ALLOW_DEMO: 'true'