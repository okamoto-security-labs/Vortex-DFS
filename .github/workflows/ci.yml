name: Vortex DFS CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  VORTEX_MASTER_KEY: "test_master_key_32_bytes_base64_encoded_dummy=="

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust Toolchain
      run: |
        rustup default stable
        rustup component add clippy rustfmt

    - name: Validate scanner UI and Cloudflare Pages Functions
      run: |
        for f in functions/v1/scans.js functions/v1/scanner/checkout.js functions/stripe/webhook.js; do
          node --input-type=module --check < "$f"
        done
        node - <<'NODE'
        const fs = require('fs');
        const html = fs.readFileSync('index.html','utf8');
        const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)];
        if (!scripts.length) throw Error('No inline script in scanner UI');
        for (const match of scripts) new Function(match[1]);
        if (!html.includes('id="scanner"') || !html.includes('Request early access')) throw Error('Scanner early-access section missing');
        if (!html.includes('data:image/png;base64,')) throw Error('Monochrome logo missing');
        console.log('Scanner UI and Pages Functions syntax OK');
        NODE
        node tests/prompt-triage-regression.cjs

    - name: Run Cargo Check
      run: cargo check --manifest-path backend/Cargo.toml

    - name: Check Migration Runner
      run: cargo check --manifest-path backend/Cargo.toml --bin vortex_migrate

    - name: Lint Migration Runner
      run: cargo clippy --manifest-path backend/Cargo.toml --bin vortex_migrate -- -D warnings

    - name: Run Clippy (Strict Zero-Warning Policy)
      run: cargo clippy --manifest-path backend/Cargo.toml -- -D warnings

    - name: Run Unit & Integration Tests
      run: cargo test --manifest-path backend/Cargo.toml --verbose