name: Vortex Code Runtime Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  runtime-review:
    name: Runtime Security Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vortex DFS
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download Vortex Code
        run: |
          git clone --depth 1 \
            https://github.com/okamoto-security-labs/vortex-code.git \
            /tmp/vortex-code

      - name: Build Vortex Code
        working-directory: /tmp/vortex-code
        run: cargo build --release

      - name: Scan Vortex DFS
        id: vortex_scan
        continue-on-error: true
        run: |
          /tmp/vortex-code/target/release/vortex-code \
            scan "$GITHUB_WORKSPACE/src" \
            --format github \
            --output "$GITHUB_WORKSPACE/vortex-github-review.json"

      - name: Publish inline Vortex Code review
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -s vortex-github-review.json ]; then
            python3 /tmp/vortex-code/.github/scripts/publish_review.py \
              vortex-github-review.json
          else
            echo "No Vortex Code review payload was generated."
          fi

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-code-runtime-review
          path: vortex-github-review.json
          if-no-files-found: warn

      - name: Enforce Vortex Code verdict
        if: steps.vortex_scan.outcome == 'failure'
        run: |
          echo "Vortex Code detected runtime security findings."
          exit 1
