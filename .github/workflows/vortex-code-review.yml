name: Vortex Code Runtime Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  runtime-review:
    name: Runtime Security Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vortex DFS
        uses: actions/checkout@v4

      - name: Checkout Vortex Code
        uses: actions/checkout@v4
        with:
          repository: okamoto-security-labs/vortex-code
          ref: main
          path: vortex-code

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Vortex Code
        working-directory: vortex-code
        run: cargo build --release

      - name: Generate Vortex Code review
        id: vortex_scan
        continue-on-error: true
        run: |
          ./vortex-code/target/release/vortex-code \
            scan review-fixtures \
            --format github \
            --output vortex-github-review.json

      - name: Publish inline Vortex Code review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Current directory:"
          pwd

          echo "Generated files:"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -name 'vortex-github-review.json' -print

          REVIEW_FILE="$GITHUB_WORKSPACE/vortex-github-review.json"

          if [ ! -s "$REVIEW_FILE" ]; then
            echo "Review payload not found or empty: $REVIEW_FILE"
            exit 1
          fi

          echo "Publishing payload:"
          cat "$REVIEW_FILE"

          gh api             --method POST             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/${GH_REPO}/pulls/${PR_NUMBER}/reviews"             --input "$REVIEW_FILE"

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-code-review
          path: vortex-github-review.json
          if-no-files-found: warn

      - name: Enforce Vortex Code verdict
        if: steps.vortex_scan.outcome == 'failure'
        run: |
          echo "Vortex Code detected runtime security findings."
          exit 1
