name: Vortex Code Runtime Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  runtime-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vortex DFS
        uses: actions/checkout@v4
        with:
          path: vortex-dfs

      - name: Checkout Vortex Code
        uses: actions/checkout@v4
        with:
          repository: okamoto-security-labs/vortex-code
          path: vortex-code

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Vortex Code
        working-directory: vortex-code
        run: cargo build --release

      - name: Scan Vortex DFS
        continue-on-error: true
        run: |
          ./vortex-code/target/release/vortex-code \
            scan ./vortex-dfs/src \
            --format github \
            --output vortex-github-review.json

      - name: Publish Review
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 vortex-code/.github/scripts/publish_review.py \
            vortex-github-review.json || true

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-review
          path: vortex-github-review.json
