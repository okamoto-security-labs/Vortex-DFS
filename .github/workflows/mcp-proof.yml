name: MCP proof verification

on:
  push:
    branches:
      - docs/mcp-security-proof-kamal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    name: Rust runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VORTEX_MASTER_KEY: test_master_key_32_bytes_base64_encoded_dummy==
    steps:
      - name: Check out proof branch
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Execute backend tests
        run: cargo test --manifest-path backend/Cargo.toml --locked
